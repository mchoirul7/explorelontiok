<!doctype html>
<html lang="en">

    <meta property="og:url" content="/" />
    <meta property="og:site_name" content="Rumah Lontiok AR" />
    <meta property="og:title" content="Belajar Rumah Lontiok AR" />
    <meta
      property="og:description"
      content="Ayo belajar Rumah Lontiok melalui pengalaman AR interaktif tentang arsitektur, aliran udara, iklim, dan kearifan lokal Kampar."

    <meta property="og:image" content="assets/rumah-lontiok-hero.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Belajar Rumah Lontiok AR" />

      name="twitter:description"

    <link rel="canonical" href="/" />
    <link rel="preload" href="assets/rumah-lontiok-hero.png" as="image" />

  <body>
    <main id="app" class="app-shell">
      <video

      ></video>
      <div id="sceneMount" class="scene-mount" aria-label="Rumah Lontiok AR scene"></div>
      <div id="uiRoot" class="ui-root"></div>
    </main>
    <script type="module" src="src/main.js"></script>
