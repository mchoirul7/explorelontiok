<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rumah Lontiok AR Target</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17120e;
        --paper: #f5efe3;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #211914;
        color: var(--paper);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(760px, 100%);
        display: grid;
        gap: 18px;
      }

      header {
        display: grid;
        gap: 6px;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 400;
        font-size: clamp(2rem, 7vw, 4rem);
      }

      p {
        color: rgba(245, 239, 227, 0.72);
        line-height: 1.55;
      }

      .target-card {
        padding: clamp(12px, 3vw, 24px);
        border-radius: 22px;
        background: var(--paper);
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.38);
      }

      img {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid rgba(23, 18, 14, 0.18);
      }

      .note {
        color: rgba(245, 239, 227, 0.62);
        font-size: 0.9rem;
      }

      @media print {
        body {
          padding: 0;
          background: white;
        }

        header,
        .note {
          display: none;
        }

        main {
          width: 100%;
        }

        .target-card {
          box-shadow: none;
          border-radius: 0;
          padding: 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Rumah Lontiok AR Target</h1>
        <p>Open this page on another device or print it, then point the AR camera at the image.</p>
      </header>
      <section class="target-card" aria-label="Rumah Lontiok AR target image">
        <img src="assets/targets/rumah-lontiok-target.png" alt="Rumah Lontiok AR image target" />
      </section>
      <p class="note">
        For production MindAR tracking, compile this image into assets/targets/rumah-lontiok.mind.
      </p>
    </main>
  </body>
</html>
